<SCRIPT Language="JavaScript">
var scroll_perm = null;
var scroll_bar_width = null;

function $E(id){ return document.getElementById(id);}

/*画面サイズが小さい場合にも対応できるように*/
function top_menu_resize(){

	var ie6_flg = 0;			//IE6フラグ
	var disp_min_width = 1000;	//ブラウザの最小横幅（これ以下は可変しない）
	var disp_min_height = 0;	//ブラウザの最小縦幅（これ以下は可変しない）
	var contents_width = null;	//contentsの幅を特別に指定したい場合
	var search_tile_width = 790; //検索条件部分の横幅設定

//タグ横長版

	if($E("tag_menu_tag")){
		if($E("tag_menu_tag").scrollWidth + 287 > disp_min_width){
			disp_min_width = $E("tag_menu_tag").scrollWidth + 287;
		}
	}

/*タグ改行版 テスト
	if($E("tag_menu_tag") && $E("tag_menu")){
		if($E("tag_menu_tag").scrollHeight > 32){
			$E("tag_menu").style.height = $E("tag_menu_tag").scrollHeight + "px";
		}
	}
*/
	var setting_id = ["main_menu","tag_menu","search_menu","contents"];
/*
	document.body.style.overflowX = "hidden";
	document.body.style.overflowY = "hidden";
*/
	document.body.style.overflowX = "auto";
	document.body.style.overflowY = "hidden";

	//ウィンドウの高さと幅を取得
	var window_width = window.innerWidth;
	var window_height = window.innerHeight;

	//クロスブラウザ対応
	if(!window_width){
		if(ie6_flg == 0){
			window_width = document.body.clientWidth;
			window_height = document.body.clientHeight;
		}else{
			//IE6対応
			window_width = document.documentElement.clientWidth;
			window_height = document.documentElement.clientHeight;
		}
	}

	//iframe内のスクロールバー表示用
	scroll_bar_width = window_width;

	//画面サイズによってメニュー部分を固定にする
	if(window_width < disp_min_width){

		if(contents_width != null){
			//横スクロール可能幅(scroll_check関数で使用)
			scroll_perm = disp_min_width - window_width;
		}

		//横幅を最小値に固定
		window_width = disp_min_width;

		$E("menu_header").style.position = "absolute";

	}else{
		scroll_perm = null;

		if(ie6_flg == 0){
			$E("menu_header").style.position = "fixed";
		}else{
			$E("menu_header").style.position = "absolute";
		}

	}

	var i;
	var obj;
	for(i= 0; i < setting_id.length; i++){
		obj = $E(setting_id[i]);

		if(obj){
			if(setting_id[i] == "contents" && contents_width != null && contents_width > window_width){
				obj.style.width = contents_width + "px";
			}else{
				obj.style.width = window_width + "px";
			}
		}
	}

	obj1 = $E("search_tile_right_top");
	obj2 = $E("search_tile_right_bottom");

	if(obj1 && obj2){
		var search_tile_change = window_width - search_tile_width;

		obj1.style.width = search_tile_change + "px";
		obj2.style.width = search_tile_change + "px";
	}

/* 高さに最低値を持たせる場合はここの処理を行う
	if(window_height < disp_min_height){
		window_height = disp_min_height;
//		document.body.style.overflowY = "scroll";
	}
*/

	//メニュー部分の高さを設定
	var header_height = $E("menu_header").clientHeight;

	$E("menu_header_frame").style.height = header_height + "px";


	obj = $E("contents");

	if(obj){
		var contents_height = window_height - header_height;
		obj.style.height = contents_height + "px";
	}

	//横スクロールの初期化
	document.body.scrollLeft = 0;
	document.documentElement.scrollLeft = 0;

	scrollbar_disp_func();
}

function scrollbar_disp_func(){
	if(typeof document.getElementById("list").contentWindow.scroll_bar_disp === 'function'){
		document.getElementById("list").contentWindow.scroll_bar_disp(scroll_bar_width);
	}

}

//画面のリサイズ時に処理が連続して発生しないように
var timer = false;

function top_menu_resize_setTime(){
	//setTimeoutで設定した関数をクリアする
	if(timer !== false){
		clearTimeout(timer);
    	}

	//この関数が呼ばれてから0.05秒間リサイズしなければリサイズの関数を実行する
	timer = setTimeout(
		function(){
			top_menu_resize();
		}, 50
	);
}


//横スクロール時のメニューバー固定
function scroll_check(){

	var ie6_flg = 0;			//IE6フラグ

	if(ie6_flg == 1){
		//IE6用処理
		var x = document.documentElement.scrollLeft || document.body.scrollLeft;
		if(scroll_perm != null){
			if(scroll_perm < x){
				$E("menu_header").style.left = x - scroll_perm + "px";
			}else{
				$E("menu_header").style.left = "0px";
			}
		}else{
			$E("menu_header").style.left = x + "px";
		}
	}else{
		//IE6以外の処理
		var x = document.documentElement.scrollLeft || document.body.scrollLeft;
		if(scroll_perm != null){
			if(scroll_perm < x){

				$E("menu_header").style.position = "fixed";
				$E("menu_header").style.right = "0px";

			}else{
				$E("menu_header").style.position = "absolute";
				$E("menu_header").style.right = "";

			}
		}
	}

	var scroll_obj1 = document.getElementById("list").contentWindow.document.getElementById("scroll_containar");
	if(scroll_obj1){
		scroll_obj1.style.left = x + "px";
	}
}

window.onresize = top_menu_resize_setTime;
